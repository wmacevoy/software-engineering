name: check

on:
  push:
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false   # when it breaks, the interesting question is which platforms broke (SE1/O3)
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.9", "3.x"]   # the oldest se.py supports, and the newest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # the check compares principles with the last release tag
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The same commands a contributor runs locally (O3); no dependencies to install.
      - run: node tools/check.js
      - run: node tools/since.js --check
      - run: python se.py --self
      - run: python -I tools/test_se.py
      - if: runner.os != 'Windows'
        run: ./se --version
      - shell: pwsh
        run: ./se.ps1 --version
